[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]

# No remappings yet — Safe, Zodiac, Solady, OZ are not vendored in this repo
# checkout. Vendoring is a dependency addition; per CLAUDE.md, ask before
# adding it. See contracts/lib/README.md.
remappings = []

# Foundry invariant runs get their own knobs — invariant suites are slow by
# design (STACK ADR-3); CI gates test-invariant separately from `just test`.
[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci]
fuzz = { runs = 1000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
