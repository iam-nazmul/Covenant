[project]
name = "underwriter"
version = "0.1.0"
description = "Covenant underwriting model serving — signed off-chain inference (STACK ADR-10)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "eth-account>=0.13",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
