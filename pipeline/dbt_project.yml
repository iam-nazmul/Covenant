name: 'covenant_pipeline'
version: '0.1.0'
config-version: 2
profile: 'covenant_pipeline'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Every feature model is as_of-parameterized (CLAUDE.md, STACK ADR-8).
  # No default here — as_of must be passed explicitly per run so a leaky
  # default can never silently apply.
  as_of: null

models:
  covenant_pipeline:
    staging:
      +materialized: view
      +schema: staging
    features:
      +materialized: table
      +schema: features
