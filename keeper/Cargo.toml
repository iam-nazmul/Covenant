[package]
name = "keeper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
alloy = { version = "0.9", features = ["signers", "providers", "network"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
backoff = { version = "0.4", features = ["tokio"] }

[profile.release]
panic = "abort"
